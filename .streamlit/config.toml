# Streamlit's default primaryColor is #FF4B4B, which leaked onto the year slider, the
# phase radio and the active tab underline. This is OCHRE: the palette's bright yellow
# is for filled shapes and measures 1.54:1 on white, so a slider track or a radio dot
# drawn in it would be invisible. Config cannot branch on theme, and this step reads on
# both grounds.
[theme]
primaryColor = "#B07D0A"
